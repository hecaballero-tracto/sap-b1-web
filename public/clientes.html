<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6c343" />
  <meta name="description" content="Consulta de clientes desde SAP Business One Service Layer" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SAP B1" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/img/tractor-icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Addon de Consultas</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <style>
    body { background-color: #f8f9fa; }
    .table thead th { white-space: nowrap; }
    .table td { vertical-align: middle; }
    .balance-positive { color: #198754; font-weight: 600; }
    .balance-negative { color: #dc3545; font-weight: 600; }
    .navbar-tracto {
      background-color: #f6c343 !important;
      color: #1a1a1a;
    }
    .navbar-tracto .navbar-brand,
    .navbar-tracto .nav-link,
    .navbar-tracto .navbar-text,
    .navbar-tracto .navbar-toggler,
    .navbar-tracto .navbar-toggler-icon,
    .navbar-tracto i {
      color: #1a1a1a !important;
    }
    .navbar-tracto .nav-link:hover,
    .navbar-tracto .nav-link:focus,
    .navbar-tracto .navbar-brand:hover,
    .navbar-tracto .navbar-brand:focus {
      color: #000000 !important;
    }
    .navbar-tracto .nav-link.active {
      color: #000000 !important;
      font-weight: 600;
    }
    .navbar-tracto .navbar-toggler {
      border-color: rgba(0, 0, 0, 0.35);
    }
    .navbar-tracto .navbar-toggler-icon {
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Cpath stroke='%231a1a1a' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-tracto mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
        <img
          src="/img/logo-tracto.png"
          alt="Tracto"
          style="height: 36px; width: auto; vertical-align: middle;"
        />
      </span>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Alternar navegación"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/clientes.html">
              <i class="bi bi-people-fill me-1"></i>Clientes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/articulos.html">
              <i class="bi bi-box-seam me-1"></i>Productos
            </a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span id="userName" class="small" style="color: #1a1a1a;"></span>
          <button id="btnRefresh" class="btn btn-dark btn-sm">
            <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
          </button>
          <button id="btnLogout" class="btn btn-outline-dark btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="card shadow-sm">
      <div class="card-header bg-white d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <div class="input-group" style="max-width: 400px;">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input
            id="searchInput"
            type="text"
            class="form-control"
            placeholder="Buscar por código, nombre, ciudad..."
          />
        </div>
        <span id="counter" class="text-muted small"></span>
      </div>
      <div class="card-footer bg-white d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <label for="pageSize" class="form-label mb-0 small text-muted">Filas por página:</label>
          <select id="pageSize" class="form-select form-select-sm" style="width: auto;">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span id="pageInfo" class="text-muted small"></span>
          <button id="btnPrev" class="btn btn-outline-secondary btn-sm" disabled>
            <i class="bi bi-chevron-left"></i> Anterior
          </button>
          <button id="btnNext" class="btn btn-outline-secondary btn-sm" disabled>
            Siguiente <i class="bi bi-chevron-right"></i>
          </button>
        </div>
      </div>
      <div class="card-body p-0">
        <div id="alertBox"></div>
        <div class="table-responsive">
          <table class="table table-hover table-striped mb-0">
            <thead class="table-light">
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Celular</th>
                <th>Email</th>
                <th>Dirección</th>
                <th>Ciudad</th>
                <th>País</th>
                <th class="text-end">Saldo</th>
                <th>Moneda</th>
              </tr>
            </thead>
            <tbody id="clientesBody">
              <tr>
                <td colspan="10" class="text-center py-4">
                  <div class="spinner-border text-primary" role="status"></div>
                  <div class="mt-2 text-muted">Cargando clientes...</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let clientes = [];
    let paging = { page: 1, limit: 20, total: 0, totalPages: 0 };

    const body = document.getElementById('clientesBody');
    const counter = document.getElementById('counter');
    const alertBox = document.getElementById('alertBox');
    const searchInput = document.getElementById('searchInput');
    const btnRefresh = document.getElementById('btnRefresh');
    const pageSize = document.getElementById('pageSize');
    const pageInfo = document.getElementById('pageInfo');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const userNameEl = document.getElementById('userName');
    const btnLogout = document.getElementById('btnLogout');

    async function apiFetch(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href =
          '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
        throw new Error('Sesión expirada');
      }
      return res;
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatBalance(value) {
      const num = Number(value || 0);
      const cls = num < 0 ? 'balance-negative' : 'balance-positive';
      return `<span class="${cls}">${num.toLocaleString('es-MX', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      })}</span>`;
    }

    function render(list) {
      if (!list.length) {
        body.innerHTML = `
          <tr>
            <td colspan="10" class="text-center py-4 text-muted">
              No se encontraron clientes.
            </td>
          </tr>`;
        counter.textContent = '0 clientes';
        return;
      }

      body.innerHTML = list
        .map(
          (c) => `
        <tr>
          <td><strong>${escapeHtml(c.CardCode)}</strong></td>
          <td>${escapeHtml(c.CardName)}</td>
          <td>${escapeHtml(c.Phone1)}</td>
          <td>${escapeHtml(c.Cellular)}</td>
          <td>${escapeHtml(c.EmailAddress)}</td>
          <td>${escapeHtml(c.Address)}</td>
          <td>${escapeHtml(c.City)}</td>
          <td>${escapeHtml(c.Country)}</td>
          <td class="text-end">${formatBalance(c.CurrentAccountBalance)}</td>
          <td>${escapeHtml(c.Currency)}</td>
        </tr>`
        )
        .join('');

      counter.textContent = `${list.length} cliente(s)`;
    }

    function updatePagingControls() {
      const { page, limit, total, totalPages } = paging;
      const from = total === 0 ? 0 : (page - 1) * limit + 1;
      const to = Math.min(page * limit, total);
      pageInfo.textContent = `Página ${page} de ${totalPages || 1}`;
      btnPrev.disabled = page <= 1;
      btnNext.disabled = page >= totalPages;
    }

    function buildQuery() {
      const params = new URLSearchParams();
      params.set('page', String(paging.page));
      params.set('limit', String(paging.limit));

      const term = searchInput.value.trim();
      if (term) params.set('search', term);

      return params.toString();
    }

    async function cargarClientes() {
      alertBox.innerHTML = '';
      body.innerHTML = `
        <tr>
          <td colspan="10" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <div class="mt-2 text-muted">Cargando clientes...</div>
          </td>
        </tr>`;

      try {
        const res = await apiFetch(`/api/clientes?${buildQuery()}`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(
            (data && data.error && (data.error.message || JSON.stringify(data.error))) ||
              'Error al obtener clientes'
          );
        }

        clientes = data.data || [];
        paging = {
          page: data.page ?? paging.page,
          limit: data.limit ?? paging.limit,
          total: data.total ?? 0,
          totalPages: data.totalPages ?? 0,
        };
        render(clientes);
        updatePagingControls();
      } catch (err) {
        if (err && err.message === 'Sesión expirada') return;
        body.innerHTML = '';
        alertBox.innerHTML = `
          <div class="alert alert-danger m-3 mb-0">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            ${escapeHtml(err.message)}
          </div>`;
        counter.textContent = '';
        pageInfo.textContent = '';
        btnPrev.disabled = true;
        btnNext.disabled = true;
      }
    }

    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        paging.page = 1;
        cargarClientes();
      }, 350);
    });

    pageSize.addEventListener('change', () => {
      paging.limit = parseInt(pageSize.value, 10) || 20;
      paging.page = 1;
      cargarClientes();
    });

    btnPrev.addEventListener('click', () => {
      paging.page = Math.max(1, paging.page - 1);
      cargarClientes();
    });

    btnNext.addEventListener('click', () => {
      paging.page = paging.page + 1;
      cargarClientes();
    });

    btnRefresh.addEventListener('click', () => {
      paging.page = 1;
      cargarClientes();
    });

    btnLogout.addEventListener('click', async () => {
      try {
        await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
      } catch (_) {
        /* ignorar errores de red al cerrar sesión */
      }
      window.location.href = '/login.html';
    });

    async function cargarUsuario() {
      try {
        const res = await apiFetch('/api/me');
        if (!res.ok) return;
        const data = await res.json();
        const user = data && data.user;
        if (user) {
          userNameEl.textContent = user.displayName || user.username || '';
        }
      } catch (_) {
        /* silencioso: si falla, no se muestra el nombre */
      }
    }

    if ('serviceWorker' in navigator && window.isSecureContext) {
      // Recargar una sola vez cuando un nuevo SW tome el control
      let swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (swRefreshing) return;
        swRefreshing = true;
        window.location.reload();
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/sw.js')
          .then((reg) => {
            // Buscar actualizaciones al cargar y periódicamente
            reg.update().catch(() => {});
            setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
          })
          .catch((err) => {
            console.warn('No se pudo registrar el service worker:', err);
          });
      });
    } else if ('serviceWorker' in navigator) {
      console.warn(
        'Service worker no registrado: se requiere contexto seguro (HTTPS o localhost).'
      );
    }

    cargarUsuario();
    cargarClientes();
  </script>
</body>
</html>
