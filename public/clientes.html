<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a6ed1" />
  <meta name="description" content="Consulta de clientes desde SAP Business One Service Layer" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SAP B1" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Clientes - SAP B1</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <style>
    body { background-color: #f8f9fa; }
    .table thead th { white-space: nowrap; }
    .table td { vertical-align: middle; }
    .balance-positive { color: #198754; font-weight: 600; }
    .balance-negative { color: #dc3545; font-weight: 600; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-people-fill me-2"></i>Clientes SAP B1
      </span>
      <button id="btnRefresh" class="btn btn-light btn-sm">
        <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
      </button>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="card shadow-sm">
      <div class="card-header bg-white d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <div class="input-group" style="max-width: 400px;">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input
            id="searchInput"
            type="text"
            class="form-control"
            placeholder="Buscar por código, nombre, ciudad..."
          />
        </div>
        <span id="counter" class="text-muted small"></span>
      </div>
      <div class="card-footer bg-white d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <label for="pageSize" class="form-label mb-0 small text-muted">Filas por página:</label>
          <select id="pageSize" class="form-select form-select-sm" style="width: auto;">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span id="pageInfo" class="text-muted small"></span>
          <button id="btnPrev" class="btn btn-outline-secondary btn-sm" disabled>
            <i class="bi bi-chevron-left"></i> Anterior
          </button>
          <button id="btnNext" class="btn btn-outline-secondary btn-sm" disabled>
            Siguiente <i class="bi bi-chevron-right"></i>
          </button>
        </div>
      </div>
      <div class="card-body p-0">
        <div id="alertBox"></div>
        <div class="table-responsive">
          <table class="table table-hover table-striped mb-0">
            <thead class="table-light">
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Celular</th>
                <th>Email</th>
                <th>Dirección</th>
                <th>Ciudad</th>
                <th>País</th>
                <th class="text-end">Saldo</th>
                <th>Moneda</th>
              </tr>
            </thead>
            <tbody id="clientesBody">
              <tr>
                <td colspan="10" class="text-center py-4">
                  <div class="spinner-border text-primary" role="status"></div>
                  <div class="mt-2 text-muted">Cargando clientes...</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let clientes = [];
    let paging = { page: 1, limit: 20, total: 0, totalPages: 0 };

    const body = document.getElementById('clientesBody');
    const counter = document.getElementById('counter');
    const alertBox = document.getElementById('alertBox');
    const searchInput = document.getElementById('searchInput');
    const btnRefresh = document.getElementById('btnRefresh');
    const pageSize = document.getElementById('pageSize');
    const pageInfo = document.getElementById('pageInfo');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');

    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatBalance(value) {
      const num = Number(value || 0);
      const cls = num < 0 ? 'balance-negative' : 'balance-positive';
      return `<span class="${cls}">${num.toLocaleString('es-MX', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      })}</span>`;
    }

    function render(list) {
      if (!list.length) {
        body.innerHTML = `
          <tr>
            <td colspan="10" class="text-center py-4 text-muted">
              No se encontraron clientes.
            </td>
          </tr>`;
        counter.textContent = '0 clientes';
        return;
      }

      body.innerHTML = list
        .map(
          (c) => `
        <tr>
          <td><strong>${escapeHtml(c.CardCode)}</strong></td>
          <td>${escapeHtml(c.CardName)}</td>
          <td>${escapeHtml(c.Phone1)}</td>
          <td>${escapeHtml(c.Cellular)}</td>
          <td>${escapeHtml(c.EmailAddress)}</td>
          <td>${escapeHtml(c.Address)}</td>
          <td>${escapeHtml(c.City)}</td>
          <td>${escapeHtml(c.Country)}</td>
          <td class="text-end">${formatBalance(c.CurrentAccountBalance)}</td>
          <td>${escapeHtml(c.Currency)}</td>
        </tr>`
        )
        .join('');

      counter.textContent = `${list.length} cliente(s)`;
    }

    function updatePagingControls() {
      const { page, limit, total, totalPages } = paging;
      const from = total === 0 ? 0 : (page - 1) * limit + 1;
      const to = Math.min(page * limit, total);
      pageInfo.textContent = `Página ${page} de ${totalPages || 1}`;
      btnPrev.disabled = page <= 1;
      btnNext.disabled = page >= totalPages;
    }

    function buildQuery() {
      const params = new URLSearchParams();
      params.set('page', String(paging.page));
      params.set('limit', String(paging.limit));

      const term = searchInput.value.trim();
      if (term) params.set('search', term);

      return params.toString();
    }

    async function cargarClientes() {
      alertBox.innerHTML = '';
      body.innerHTML = `
        <tr>
          <td colspan="10" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <div class="mt-2 text-muted">Cargando clientes...</div>
          </td>
        </tr>`;

      try {
        const res = await fetch(`/api/clientes?${buildQuery()}`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(
            (data && data.error && (data.error.message || JSON.stringify(data.error))) ||
              'Error al obtener clientes'
          );
        }

        clientes = data.data || [];
        paging = {
          page: data.page ?? paging.page,
          limit: data.limit ?? paging.limit,
          total: data.total ?? 0,
          totalPages: data.totalPages ?? 0,
        };
        render(clientes);
        updatePagingControls();
      } catch (err) {
        body.innerHTML = '';
        alertBox.innerHTML = `
          <div class="alert alert-danger m-3 mb-0">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            ${escapeHtml(err.message)}
          </div>`;
        counter.textContent = '';
        pageInfo.textContent = '';
        btnPrev.disabled = true;
        btnNext.disabled = true;
      }
    }

    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        paging.page = 1;
        cargarClientes();
      }, 350);
    });

    pageSize.addEventListener('change', () => {
      paging.limit = parseInt(pageSize.value, 10) || 20;
      paging.page = 1;
      cargarClientes();
    });

    btnPrev.addEventListener('click', () => {
      paging.page = Math.max(1, paging.page - 1);
      cargarClientes();
    });

    btnNext.addEventListener('click', () => {
      paging.page = paging.page + 1;
      cargarClientes();
    });

    btnRefresh.addEventListener('click', () => {
      paging.page = 1;
      cargarClientes();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('No se pudo registrar el service worker:', err);
        });
      });
    }

    cargarClientes();
  </script>
</body>
</html>
