<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a6ed1" />
  <meta name="description" content="Consulta de stock de artículos por depósito desde SAP Business One Service Layer" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SAP B1" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Artículos - SAP B1</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <style>
    body { background-color: #f8f9fa; }
    .table thead th { white-space: nowrap; }
    .table td { vertical-align: middle; }
    .stock-positive { color: #198754; font-weight: 600; }
    .stock-zero { color: #6c757d; font-weight: 600; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-box-seam me-2"></i>Artículos SAP B1
        <span id="secureBadge" class="badge bg-success ms-2 d-none" title="Conexión segura">
          <i class="bi bi-shield-lock-fill me-1"></i>HTTPS
        </span>
      </span>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Alternar navegación"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/clientes.html">
              <i class="bi bi-people-fill me-1"></i>Clientes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/articulos.html">
              <i class="bi bi-box-seam me-1"></i>Artículos
            </a>
          </li>
        </ul>
        <button id="btnRefresh" class="btn btn-light btn-sm">
          <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="card shadow-sm">
      <div class="card-header bg-white d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <div class="input-group" style="max-width: 400px;">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input
            id="searchInput"
            type="text"
            class="form-control"
            placeholder="Buscar por código o descripción..."
          />
        </div>
        <span id="counter" class="text-muted small"></span>
      </div>
      <div class="card-footer bg-white d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <label for="pageSize" class="form-label mb-0 small text-muted">Filas por página:</label>
          <select id="pageSize" class="form-select form-select-sm" style="width: auto;">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span id="pageInfo" class="text-muted small"></span>
          <button id="btnPrev" class="btn btn-outline-secondary btn-sm" disabled>
            <i class="bi bi-chevron-left"></i> Anterior
          </button>
          <button id="btnNext" class="btn btn-outline-secondary btn-sm" disabled>
            Siguiente <i class="bi bi-chevron-right"></i>
          </button>
        </div>
      </div>
      <div class="card-body p-0">
        <div id="alertBox"></div>
        <div class="table-responsive">
          <table class="table table-hover table-striped mb-0">
            <thead class="table-light">
              <tr>
                <th>Código</th>
                <th>Descripción</th>
                <th class="text-end">Stock Total</th>
                <th>Unidad de Medida</th>
                <th class="text-center">Depósitos</th>
              </tr>
            </thead>
            <tbody id="articulosBody">
              <tr>
                <td colspan="5" class="text-center py-4">
                  <div class="spinner-border text-primary" role="status"></div>
                  <div class="mt-2 text-muted">Cargando artículos...</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de depósitos -->
  <div class="modal fade" id="warehouseModal" tabindex="-1" aria-labelledby="warehouseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="warehouseModalLabel">
            <i class="bi bi-building me-2"></i>Stock por depósito
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-2"><strong id="modalItemCode"></strong> - <span id="modalItemName"></span></p>
          <div class="table-responsive">
            <table class="table table-sm table-striped mb-0">
              <thead class="table-light">
                <tr>
                  <th>Depósito</th>
                  <th class="text-end">Stock</th>
                </tr>
              </thead>
              <tbody id="modalWarehouseBody"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let articulos = [];
    let paging = { page: 1, limit: 20, total: 0, totalPages: 0 };

    const body = document.getElementById('articulosBody');
    const counter = document.getElementById('counter');
    const alertBox = document.getElementById('alertBox');
    const searchInput = document.getElementById('searchInput');
    const btnRefresh = document.getElementById('btnRefresh');
    const pageSize = document.getElementById('pageSize');
    const pageInfo = document.getElementById('pageInfo');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const modalItemCode = document.getElementById('modalItemCode');
    const modalItemName = document.getElementById('modalItemName');
    const modalWarehouseBody = document.getElementById('modalWarehouseBody');
    const warehouseModal = new bootstrap.Modal(document.getElementById('warehouseModal'));

    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatStock(value) {
      const num = Number(value || 0);
      const cls = num > 0 ? 'stock-positive' : 'stock-zero';
      return `<span class="${cls}">${num.toLocaleString('es-MX', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      })}</span>`;
    }

    function render(list) {
      if (!list.length) {
        body.innerHTML = `
          <tr>
            <td colspan="5" class="text-center py-4 text-muted">
              No se encontraron artículos.
            </td>
          </tr>`;
        counter.textContent = '0 artículos';
        return;
      }

      body.innerHTML = list
        .map((a, idx) => {
          const count = Array.isArray(a.Warehouses) ? a.Warehouses.length : 0;
          return `
        <tr>
          <td><strong>${escapeHtml(a.ItemCode)}</strong></td>
          <td>${escapeHtml(a.ItemName)}</td>
          <td class="text-end">${formatStock(a.QuantityOnStock)}</td>
          <td>${escapeHtml(a.SalesUnit)}</td>
          <td class="text-center">
            <button
              class="btn btn-outline-primary btn-sm"
              data-index="${idx}"
              ${count === 0 ? 'disabled' : ''}
            >
              <i class="bi bi-building me-1"></i>${count}
            </button>
          </td>
        </tr>`;
        })
        .join('');

      body.querySelectorAll('button[data-index]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-index'), 10);
          openWarehouses(list[idx]);
        });
      });

      counter.textContent = `${list.length} artículo(s)`;
    }

    function openWarehouses(item) {
      if (!item) return;
      modalItemCode.textContent = item.ItemCode || '';
      modalItemName.textContent = item.ItemName || '';

      const whs = Array.isArray(item.Warehouses) ? item.Warehouses : [];
      if (!whs.length) {
        modalWarehouseBody.innerHTML = `
          <tr><td colspan="2" class="text-center text-muted py-3">Sin stock en depósitos.</td></tr>`;
      } else {
        modalWarehouseBody.innerHTML = whs
          .map(
            (w) => `
          <tr>
            <td>${escapeHtml(w.WarehouseCode)}</td>
            <td class="text-end">${formatStock(w.InStock)}</td>
          </tr>`
          )
          .join('');
      }

      warehouseModal.show();
    }

    function updatePagingControls() {
      const { page, totalPages } = paging;
      pageInfo.textContent = `Página ${page} de ${totalPages || 1}`;
      btnPrev.disabled = page <= 1;
      btnNext.disabled = page >= totalPages;
    }

    function buildQuery() {
      const params = new URLSearchParams();
      params.set('page', String(paging.page));
      params.set('limit', String(paging.limit));

      const term = searchInput.value.trim();
      if (term) params.set('search', term);

      return params.toString();
    }

    async function cargarArticulos() {
      alertBox.innerHTML = '';
      body.innerHTML = `
        <tr>
          <td colspan="5" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <div class="mt-2 text-muted">Cargando artículos...</div>
          </td>
        </tr>`;

      try {
        const res = await fetch(`/api/articulos?${buildQuery()}`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(
            (data && data.error && (data.error.message || JSON.stringify(data.error))) ||
              'Error al obtener artículos'
          );
        }

        articulos = data.data || [];
        paging = {
          page: data.page ?? paging.page,
          limit: data.limit ?? paging.limit,
          total: data.total ?? 0,
          totalPages: data.totalPages ?? 0,
        };
        render(articulos);
        updatePagingControls();
      } catch (err) {
        body.innerHTML = '';
        alertBox.innerHTML = `
          <div class="alert alert-danger m-3 mb-0">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            ${escapeHtml(err.message)}
          </div>`;
        counter.textContent = '';
        pageInfo.textContent = '';
        btnPrev.disabled = true;
        btnNext.disabled = true;
      }
    }

    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        paging.page = 1;
        cargarArticulos();
      }, 350);
    });

    pageSize.addEventListener('change', () => {
      paging.limit = parseInt(pageSize.value, 10) || 20;
      paging.page = 1;
      cargarArticulos();
    });

    btnPrev.addEventListener('click', () => {
      paging.page = Math.max(1, paging.page - 1);
      cargarArticulos();
    });

    btnNext.addEventListener('click', () => {
      paging.page = paging.page + 1;
      cargarArticulos();
    });

    btnRefresh.addEventListener('click', () => {
      paging.page = 1;
      cargarArticulos();
    });

    // Indicador visual de conexión segura
    if (window.isSecureContext && location.protocol === 'https:') {
      const badge = document.getElementById('secureBadge');
      if (badge) badge.classList.remove('d-none');
    }

    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('No se pudo registrar el service worker:', err);
        });
      });
    } else if ('serviceWorker' in navigator) {
      console.warn(
        'Service worker no registrado: se requiere contexto seguro (HTTPS o localhost).'
      );
    }

    cargarArticulos();
  </script>
</body>
</html>
