<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a6ed1" />
  <meta name="description" content="Consulta de stock de artículos por depósito desde SAP Business One Service Layer" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SAP B1" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Artículos - SAP B1</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <style>
    body { background-color: #f8f9fa; }
    .table thead th { white-space: nowrap; }
    .table td { vertical-align: middle; }
    .stock-positive { color: #198754; font-weight: 600; }
    .stock-zero { color: #6c757d; font-weight: 600; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-box-seam me-2"></i>Artículos SAP B1
        <span id="secureBadge" class="badge bg-success ms-2 d-none" title="Conexión segura">
          <i class="bi bi-shield-lock-fill me-1"></i>HTTPS
        </span>
      </span>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Alternar navegación"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/clientes.html">
              <i class="bi bi-people-fill me-1"></i>Clientes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/articulos.html">
              <i class="bi bi-box-seam me-1"></i>Productos
            </a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span id="userName" class="text-white small"></span>
          <button id="btnRefresh" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
          </button>
          <button id="btnLogout" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="card shadow-sm">
      <div class="card-header bg-white d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <div class="input-group" style="max-width: 400px;">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input
            id="searchInput"
            type="text"
            class="form-control"
            placeholder="Buscar por código o descripción..."
          />
        </div>
        <div class="d-flex align-items-center gap-2">
          <button
            class="btn btn-outline-secondary btn-sm"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#filtersPanel"
            aria-expanded="false"
            aria-controls="filtersPanel"
          >
            <i class="bi bi-funnel me-1"></i>Filtros
          </button>
          <div class="dropdown">
            <button
              class="btn btn-outline-secondary btn-sm dropdown-toggle"
              type="button"
              id="columnsDropdown"
              data-bs-toggle="dropdown"
              data-bs-auto-close="outside"
              aria-expanded="false"
            >
              <i class="bi bi-layout-three-columns me-1"></i>Columnas
            </button>
            <ul class="dropdown-menu dropdown-menu-end p-2" id="columnsMenu" style="max-height: 320px; overflow-y: auto;"></ul>
          </div>
        </div>
      </div>
      <div class="collapse" id="filtersPanel">
        <div class="card-body border-bottom bg-light">
          <div class="row g-2">
            <div class="col-12 col-md-4">
              <label for="filterRubro" class="form-label small mb-1">Rubro</label>
              <select id="filterRubro" class="form-select form-select-sm">
                <option value="">Todos</option>
              </select>
            </div>
            <div class="col-12 col-md-4">
              <label for="filterFabricante" class="form-label small mb-1">Fabricante</label>
              <select id="filterFabricante" class="form-select form-select-sm">
                <option value="">Todos</option>
              </select>
            </div>
            <div class="col-12 col-md-4">
              <label for="filterMarca" class="form-label small mb-1">Marca</label>
              <select id="filterMarca" class="form-select form-select-sm">
                <option value="">Todas</option>
              </select>
            </div>
          </div>
          <div class="mt-2 text-end">
            <button id="btnClearFilters" class="btn btn-link btn-sm p-0">Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div class="card-footer bg-white d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <label for="pageSize" class="form-label mb-0 small text-muted">Filas por página:</label>
          <select id="pageSize" class="form-select form-select-sm" style="width: auto;">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span id="pageInfo" class="text-muted small"></span>
          <button id="btnPrev" class="btn btn-outline-secondary btn-sm" disabled>
            <i class="bi bi-chevron-left"></i> Anterior
          </button>
          <button id="btnNext" class="btn btn-outline-secondary btn-sm" disabled>
            Siguiente <i class="bi bi-chevron-right"></i>
          </button>
        </div>
      </div>
      <div class="card-body p-0">
        <div id="alertBox"></div>
        <div class="table-responsive">
          <table class="table table-hover table-striped mb-0">
            <thead class="table-light">
              <tr id="articulosHead"></tr>
            </thead>
            <tbody id="articulosBody">
              <tr>
                <td colspan="20" class="text-center py-4">
                  <div class="spinner-border text-primary" role="status"></div>
                  <div class="mt-2 text-muted">Cargando artículos...</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de depósitos -->
  <div class="modal fade" id="warehouseModal" tabindex="-1" aria-labelledby="warehouseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="warehouseModalLabel">
            <i class="bi bi-building me-2"></i>Stock por depósito
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-2"><strong id="modalItemCode"></strong> - <span id="modalItemName"></span></p>
          <div class="table-responsive">
            <table class="table table-sm table-striped mb-0">
              <thead class="table-light">
                <tr>
                  <th>Código</th>
                  <th>Nombre Almacén</th>
                  <th class="text-end">En Stock</th>
                  <th class="text-end">Comprometido</th>
                  <th class="text-end">En Pedido</th>
                  <th class="text-end">Disponible</th>
                </tr>
              </thead>
              <tbody id="modalWarehouseBody"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let articulos = [];
    let paging = { page: 1, limit: 20, total: 0, totalPages: 0 };

    // Definición de columnas disponibles
    const COLUMNS = [
      { key: 'ItemCode', label: 'Código', align: '', default: true },
      { key: 'ItemName', label: 'Descripción', align: '', default: true },
      { key: 'FrgnName', label: 'Nombre Interno', align: '', default: false },
      { key: 'SalesUnit', label: 'Unidad', align: '', default: true },
      { key: 'SWW', label: 'Familia', align: '', default: false },
      { key: 'rubro', label: 'Rubro', align: '', default: false },
      { key: 'fabricante', label: 'Fabricante', align: '', default: false },
      { key: 'U_Marca', label: 'Marca', align: '', default: false },
      { key: 'U_Modelo', label: 'Modelo', align: '', default: false },
      { key: 'QuantityOnStock', label: 'Stock Total', align: 'text-end', default: true, format: 'stock' },
      { key: 'IsCommited', label: 'Comprometido', align: 'text-end', default: false, format: 'stock' },
      { key: 'OnOrder', label: 'En Pedido', align: 'text-end', default: false, format: 'stock' },
      { key: 'Available', label: 'Disponible', align: 'text-end', default: true, format: 'stock' },
      { key: 'CreateDate', label: 'Fecha Creación', align: '', default: false, format: 'date' },
      { key: 'Warehouses', label: 'Depósitos', align: 'text-center', default: true, format: 'warehouses' },
    ];

    const STORAGE_KEY = 'articulos.visibleColumns';

    function loadVisibleColumns() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            const valid = new Set(COLUMNS.map((c) => c.key));
            const filtered = parsed.filter((k) => valid.has(k));
            if (filtered.length) return new Set(filtered);
          }
        }
      } catch (_) {
        /* ignorar */
      }
      return new Set(COLUMNS.filter((c) => c.default).map((c) => c.key));
    }

    function saveVisibleColumns(set) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(set)));
      } catch (_) {
        /* ignorar */
      }
    }

    let visibleColumns = loadVisibleColumns();

    const body = document.getElementById('articulosBody');
    const head = document.getElementById('articulosHead');
    const columnsMenu = document.getElementById('columnsMenu');
    const filterRubro = document.getElementById('filterRubro');
    const filterFabricante = document.getElementById('filterFabricante');
    const filterMarca = document.getElementById('filterMarca');
    const btnClearFilters = document.getElementById('btnClearFilters');
    const alertBox = document.getElementById('alertBox');
    const searchInput = document.getElementById('searchInput');
    const btnRefresh = document.getElementById('btnRefresh');
    const pageSize = document.getElementById('pageSize');
    const pageInfo = document.getElementById('pageInfo');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const modalItemCode = document.getElementById('modalItemCode');
    const modalItemName = document.getElementById('modalItemName');
    const modalWarehouseBody = document.getElementById('modalWarehouseBody');
    const warehouseModal = new bootstrap.Modal(document.getElementById('warehouseModal'));
    const userNameEl = document.getElementById('userName');
    const btnLogout = document.getElementById('btnLogout');

    async function apiFetch(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href =
          '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
        throw new Error('Sesión expirada');
      }
      return res;
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatStock(value) {
      const num = Number(value || 0);
      const cls = num > 0 ? 'stock-positive' : 'stock-zero';
      return `<span class="${cls}">${num.toLocaleString('es-MX', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      })}</span>`;
    }

    function formatDate(value) {
      if (!value) return '';
      // SAP devuelve "/Date(1234567890000)/" o ISO
      const m = /\/Date\((\d+)\)\//.exec(String(value));
      let d;
      if (m) {
        d = new Date(parseInt(m[1], 10));
      } else {
        d = new Date(value);
      }
      if (isNaN(d.getTime())) return escapeHtml(value);
      return d.toLocaleDateString('es-MX');
    }

    function renderHead() {
      head.innerHTML = COLUMNS.filter((c) => visibleColumns.has(c.key))
        .map((c) => `<th class="${c.align}">${escapeHtml(c.label)}</th>`)
        .join('');
    }

    function renderColumnsMenu() {
      columnsMenu.innerHTML = COLUMNS.map(
        (c) => `
        <li>
          <label class="dropdown-item d-flex align-items-center gap-2 mb-0">
            <input type="checkbox" class="form-check-input mt-0" data-col="${c.key}" ${
          visibleColumns.has(c.key) ? 'checked' : ''
        } />
            <span>${escapeHtml(c.label)}</span>
          </label>
        </li>`
      ).join('');

      columnsMenu.querySelectorAll('input[data-col]').forEach((chk) => {
        chk.addEventListener('change', () => {
          const key = chk.getAttribute('data-col');
          if (chk.checked) visibleColumns.add(key);
          else visibleColumns.delete(key);
          saveVisibleColumns(visibleColumns);
          renderHead();
          render(articulos);
        });
      });
    }

    function renderCell(col, item) {
      const value = item[col.key];
      if (col.format === 'stock') return formatStock(value);
      if (col.format === 'date') return formatDate(value);
      if (col.format === 'warehouses') {
        const count = Array.isArray(item.Warehouses) ? item.Warehouses.length : 0;
        const idx = articulos.indexOf(item);
        return `<button class="btn btn-outline-primary btn-sm" data-index="${idx}" ${
          count === 0 ? 'disabled' : ''
        }><i class="bi bi-building me-1"></i>${count}</button>`;
      }
      return escapeHtml(value);
    }

    function render(list) {
      const cols = COLUMNS.filter((c) => visibleColumns.has(c.key));
      const colspan = Math.max(cols.length, 1);

      if (!list.length) {
        body.innerHTML = `
          <tr>
            <td colspan="${colspan}" class="text-center py-4 text-muted">
              No se encontraron artículos.
            </td>
          </tr>`;
        return;
      }

      body.innerHTML = list
        .map((a) => {
          const cells = cols
            .map((c) => {
              const content = renderCell(c, a);
              const isCode = c.key === 'ItemCode';
              return `<td class="${c.align}">${
                isCode ? `<strong>${content}</strong>` : content
              }</td>`;
            })
            .join('');
          return `<tr>${cells}</tr>`;
        })
        .join('');

      body.querySelectorAll('button[data-index]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-index'), 10);
          openWarehouses(list[idx]);
        });
      });
    }

    function openWarehouses(item) {
      if (!item) return;
      modalItemCode.textContent = item.ItemCode || '';
      modalItemName.textContent = item.ItemName || '';

      const whs = Array.isArray(item.Warehouses) ? item.Warehouses : [];
      if (!whs.length) {
        modalWarehouseBody.innerHTML = `
          <tr><td colspan="6" class="text-center text-muted py-3">Sin stock en depósitos.</td></tr>`;
      } else {
        modalWarehouseBody.innerHTML = whs
          .map(
            (w) => `
          <tr>
            <td><strong>${escapeHtml(w.WarehouseCode)}</strong></td>
            <td>${escapeHtml(w.WarehouseName || w.WarehouseCode)}</td>
            <td class="text-end">${formatStock(w.InStock)}</td>
            <td class="text-end">${formatStock(w.Committed)}</td>
            <td class="text-end">${formatStock(w.Ordered)}</td>
            <td class="text-end">${formatStock(w.Available)}</td>
          </tr>`
          )
          .join('');
      }

      warehouseModal.show();
    }

    function updatePagingControls() {
      const { page, totalPages } = paging;
      pageInfo.textContent = `Página ${page} de ${totalPages || 1}`;
      btnPrev.disabled = page <= 1;
      btnNext.disabled = page >= totalPages;
    }

    function buildQuery() {
      const params = new URLSearchParams();
      params.set('page', String(paging.page));
      params.set('limit', String(paging.limit));

      const term = searchInput.value.trim();
      if (term) params.set('search', term);

      if (filterRubro.value) params.set('rubro', filterRubro.value);
      if (filterFabricante.value) params.set('fabricante', filterFabricante.value);
      if (filterMarca.value) params.set('marca', filterMarca.value);

      return params.toString();
    }

    async function cargarCatalogos() {
      try {
        const res = await apiFetch('/api/articulos/catalogos');
        if (!res.ok) return;
        const data = await res.json();

        const rubros = Array.isArray(data.rubros) ? data.rubros : [];
        const fabricantes = Array.isArray(data.fabricantes) ? data.fabricantes : [];
        const marcas = Array.isArray(data.marcas) ? data.marcas : [];

        filterRubro.innerHTML =
          '<option value="">Todos</option>' +
          rubros
            .map(
              (r) =>
                `<option value="${escapeHtml(String(r.code))}">${escapeHtml(r.name)}</option>`
            )
            .join('');

        filterFabricante.innerHTML =
          '<option value="">Todos</option>' +
          fabricantes
            .map(
              (f) =>
                `<option value="${escapeHtml(String(f.code))}">${escapeHtml(f.name)}</option>`
            )
            .join('');

        filterMarca.innerHTML =
          '<option value="">Todas</option>' +
          marcas
            .map((m) => {
              const code = typeof m === 'string' ? m : m && m.code;
              const name = typeof m === 'string' ? m : (m && m.name) || code;
              return `<option value="${escapeHtml(String(code))}">${escapeHtml(String(name))}</option>`;
            })
            .join('');
      } catch (_) {
        /* silencioso: si falla, los selects quedan con "Todos" */
      }
    }

    async function cargarArticulos() {
      alertBox.innerHTML = '';
      body.innerHTML = `
        <tr>
          <td colspan="5" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <div class="mt-2 text-muted">Cargando artículos...</div>
          </td>
        </tr>`;

      try {
        const res = await apiFetch(`/api/articulos?${buildQuery()}`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(
            (data && data.error && (data.error.message || JSON.stringify(data.error))) ||
              'Error al obtener artículos'
          );
        }

        articulos = data.data || [];
        paging = {
          page: data.page ?? paging.page,
          limit: data.limit ?? paging.limit,
          total: data.total ?? 0,
          totalPages: data.totalPages ?? 0,
        };
        render(articulos);
        updatePagingControls();
      } catch (err) {
        if (err && err.message === 'Sesión expirada') return;
        body.innerHTML = '';
        alertBox.innerHTML = `
          <div class="alert alert-danger m-3 mb-0">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            ${escapeHtml(err.message)}
          </div>`;
        pageInfo.textContent = '';
        btnPrev.disabled = true;
        btnNext.disabled = true;
      }
    }

    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        paging.page = 1;
        cargarArticulos();
      }, 350);
    });

    pageSize.addEventListener('change', () => {
      paging.limit = parseInt(pageSize.value, 10) || 20;
      paging.page = 1;
      cargarArticulos();
    });

    btnPrev.addEventListener('click', () => {
      paging.page = Math.max(1, paging.page - 1);
      cargarArticulos();
    });

    btnNext.addEventListener('click', () => {
      paging.page = paging.page + 1;
      cargarArticulos();
    });

    btnRefresh.addEventListener('click', () => {
      paging.page = 1;
      cargarArticulos();
    });

    filterRubro.addEventListener('change', () => {
      paging.page = 1;
      cargarArticulos();
    });
    filterFabricante.addEventListener('change', () => {
      paging.page = 1;
      cargarArticulos();
    });
    filterMarca.addEventListener('change', () => {
      paging.page = 1;
      cargarArticulos();
    });

    btnClearFilters.addEventListener('click', () => {
      filterRubro.value = '';
      filterFabricante.value = '';
      filterMarca.value = '';
      paging.page = 1;
      cargarArticulos();
    });

    btnLogout.addEventListener('click', async () => {
      try {
        await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
      } catch (_) {
        /* ignorar errores de red al cerrar sesión */
      }
      window.location.href = '/login.html';
    });

    async function cargarUsuario() {
      try {
        const res = await apiFetch('/api/me');
        if (!res.ok) return;
        const data = await res.json();
        const user = data && data.user;
        if (user) {
          userNameEl.textContent = user.displayName || user.username || '';
        }
      } catch (_) {
        /* silencioso: si falla, no se muestra el nombre */
      }
    }

    // Indicador visual de conexión segura
    if (window.isSecureContext && location.protocol === 'https:') {
      const badge = document.getElementById('secureBadge');
      if (badge) badge.classList.remove('d-none');
    }

    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('No se pudo registrar el service worker:', err);
        });
      });
    } else if ('serviceWorker' in navigator) {
      console.warn(
        'Service worker no registrado: se requiere contexto seguro (HTTPS o localhost).'
      );
    }

    renderHead();
    renderColumnsMenu();
    cargarUsuario();
    cargarCatalogos();
    cargarArticulos();
  </script>
</body>
</html>
